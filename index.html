<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EE451A">
<title>리듬 — PT 운동 흐름 체크</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{
  --org:#EE451A; --orgD:#C0380E; --orgT:#EE451A; --orgBtn:#EE451A; --orgInk:#FFFFFF;
  --peach:#F5F5F6; --peach2:#E4E4E7; --warm:#FAFAFA;
  --ink:#18181A; --mut:#6B6B70; --faint:#8C8B90; --emptydot:#D4D4D8;
  --line:#E4E4E7; --bg:#F5F5F6; --card:#FFFFFF;
  --ok:#0F7A5E; --okBg:#E4F3ED; --warn:#B7791F; --warnBg:#FDF3E2;
  --bad:#C0392B; --badBg:#FCECEA;
  --orgLedge:#B8360E; --peachLedge:#F0AD98; --lineLedge:#D6D5D9;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{scrollbar-width:none;-ms-overflow-style:none}
html::-webkit-scrollbar,body::-webkit-scrollbar{display:none}
:focus-visible{outline:2px solid var(--orgT);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
body{font-family:"Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;
  word-break:keep-all;overflow-wrap:break-word}
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);display:flex;flex-direction:column;position:relative}
.page{flex:1;padding:4px 18px 96px;overflow-y:auto;position:relative;background:var(--card);scrollbar-width:none;-ms-overflow-style:none}
.page::-webkit-scrollbar{display:none}
.hscroll{scrollbar-width:none;-ms-overflow-style:none}
.hscroll::-webkit-scrollbar{display:none}
.veil-top{position:absolute;top:0;left:0;right:0;height:26px;pointer-events:none;z-index:5;
  -webkit-mask-image:linear-gradient(to bottom, black 0%, transparent 100%);
  mask-image:linear-gradient(to bottom, black 0%, transparent 100%);
  -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);
  background:linear-gradient(to bottom, var(--card) 35%, transparent 100%)}
button{font-family:inherit;border:none;cursor:pointer;background:none;font-size:16px}
input,select,textarea{font-family:inherit;font-size:16px}
textarea{resize:none}
h1{font-size:24px;font-weight:800;letter-spacing:-.4px;line-height:1.2}
h2{font-size:16px;font-weight:700}
.mut{color:var(--mut);font-size:14px}
.cap{color:var(--mut);font-size:12px;font-weight:600}
/* ── 눌리는 버튼: 면(face)이 그림자 받침(ledge) 위에 놓여 눌리는 물리감 ── */
.pill,.ansbtn,.chip{
  position:relative;
  transform:translateY(0);
  transition:transform .26s cubic-bezier(.34,1.56,.64,1),
             box-shadow .28s cubic-bezier(.34,1.56,.64,1),
             filter .15s ease, background .15s ease;
}
.pill:active,.ansbtn:active,.chip:active{
  transition:transform .09s ease-out, box-shadow .09s ease-out;
}
.pill{padding:13px 18px;border-radius:12px;font-size:16px;font-weight:700;background:var(--orgBtn);color:var(--orgInk);
  box-shadow:0 2px 6px rgba(184,54,14,.26), 0 5px 14px -8px rgba(238,69,26,.28)}
.pill:hover{filter:brightness(1.06)}
.pill:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(184,54,14,.14), 0 1px 4px rgba(238,69,26,.15)}
.pill.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:0 2px 5px rgba(214,213,217,.5), 0 4px 10px -8px rgba(24,23,26,.06);padding:8px 12px;border-radius:8px}
.pill.ghost:hover{background:var(--bg)}
.pill.ghost:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(214,213,217,.2)}
.pill.line{background:#fff;color:var(--mut);border:1.5px solid var(--line);
  box-shadow:0 2px 5px rgba(214,213,217,.6), 0 4px 10px -9px rgba(24,23,26,.1)}
.pill.line:hover{background:var(--bg)}
.pill.line:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(214,213,217,.25)}
.pill.wide{width:100%;padding:15px}
.pill[disabled]{opacity:.4;pointer-events:none;box-shadow:none;transform:none}
.card{background:var(--bg);border-radius:16px;padding:18px;border:1px solid var(--line);box-shadow:0 1px 4px rgba(24,23,26,.05)}
.member-detail .card{background:transparent;box-shadow:none}
.member-detail .field{margin-bottom:24px}
.member-detail .row,.member-detail .pill,.member-detail .pill.wide,.member-detail .pill.line,.member-detail .pill.ghost{box-shadow:none}
.member-detail .chip{box-shadow:none}
.badge{font-size:12px;font-weight:700;padding:4px 10px 4px 8px;border-radius:99px;white-space:nowrap;
  background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:5px}
.badge .hdot{width:6px;height:6px;border-radius:50%;flex:none}
.b-ok{box-shadow:0 0 14px -3px rgba(15,122,94,.55)}
.b-ok .hdot{background:#34d399}
.b-warn{box-shadow:0 0 10px -4px rgba(24,23,26,.14)}
.b-warn .hdot{background:var(--org)}
.care-badge{box-shadow:none;background:var(--bg);color:var(--mut)}
.care-name{font-size:18px;font-weight:800;display:block;margin-bottom:8px}
.routine-block{margin-top:8px;}
.care-notes{border:none;border-top:1px solid var(--line);border-radius:0;background:none;padding:12px 2px 0;margin-top:14px}
.b-none{background:var(--bg);color:var(--faint);box-shadow:none}
.b-none .hdot{background:var(--faint)}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:24px 20px 8px;background:#fff;position:relative;z-index:40}
.avatar-btn{width:36px;height:36px;border-radius:50%;background:var(--bg);color:var(--mut);font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;padding:0;
  transition:transform .12s ease,background .15s ease;flex:none;line-height:1}
.back-btn{width:36px;height:36px;border-radius:50%;background:#fff;color:var(--ink);
  display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;padding:0;
  transition:transform .12s ease,background .15s ease;flex:none;
  box-shadow:0 4px 12px -2px rgba(24,23,26,.12),0 2px 4px rgba(24,23,26,.06),0 0 0 .5px rgba(0,0,0,.04)}
.back-btn:hover{background:var(--line)}
.back-btn:active{transform:scale(.92)}
.back-btn svg{width:auto;height:12px;display:block;margin-right:2px}
.avatar-btn:hover{background:var(--line)}
.avatar-btn:active{transform:scale(.92)}
.profile-wrap{position:relative}
.profile-menu{position:absolute;top:calc(100% + 8px);right:0;min-width:140px;background:#fff;border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.14),0 2px 6px rgba(0,0,0,.06);border:.5px solid rgba(0,0,0,.06);
  padding:6px;z-index:50;animation:menuIn .16s ease}
.profile-menu button{width:100%;text-align:left;padding:10px 12px;border-radius:8px;background:none;border:none;
  font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;transition:background .12s ease}
.profile-menu button:hover{background:var(--bg)}
.profile-menu .name-row{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.profile-menu .name-row b{display:block;font-size:14px;font-weight:700;color:var(--ink)}
.profile-menu .name-row span{font-size:12px;color:var(--mut)}
.profile-menu .danger{color:var(--bad)}
@keyframes menuIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.menu-backdrop{position:fixed;inset:0;z-index:45;background:transparent}
.help-btn{width:16px;height:16px;color:var(--faint);border:none;background:none;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;padding:0}
.help-btn svg{width:100%;height:100%;display:block}
.help-btn:active{transform:scale(.92)}
.help-wrap{position:relative;display:inline-flex;align-items:center}
.help-pop{position:absolute;top:calc(100% + 6px);right:0;z-index:46;width:160px;background:#1C1C1F;color:#fff;font-size:12px;font-weight:400;line-height:1.45;padding:10px 12px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:menuIn .15s ease}
.logo{font-size:16px;font-weight:800}.logo span{color:var(--org)}
.nav{position:fixed;left:0;right:0;margin-left:auto;margin-right:auto;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;background:#fff;
  display:inline-flex;width:fit-content;padding:8px 16px;border-radius:999px;
  box-shadow:0 10px 32px -8px rgba(0,0,0,.18),0 4px 12px rgba(0,0,0,.08),0 1px 3px rgba(0,0,0,.05);border:.5px solid rgba(0,0,0,.06)}
.nav button{flex:none;padding:0 20px;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--faint);font-weight:700;
  transition:transform .15s ease, color .15s ease}
.nav button:active{transform:scale(.88)}
.nav button.on{color:var(--ink)}
.nav svg{width:20px;height:20px;overflow:hidden;flex:none}
.row{background:var(--card);border:1px solid rgba(228,228,231,.9);
  border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 1px 3px rgba(24,23,26,.04)}
.row.need{border-color:var(--line)}
.field{margin-bottom:14px}
.field label{display:block;font-size:14px;font-weight:700;color:var(--mut);margin-bottom:6px}
.txt{width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:14px;background:#fff;transition:border-color .15s ease,box-shadow .15s ease}
.txt:focus{border-color:var(--orgBtn);box-shadow:0 0 0 3px rgba(238,69,26,.14);outline:none}
.toast{position:fixed;top:24px;left:50%;width:calc(100% - 28px);max-width:432px;z-index:60;background:var(--ink);color:#fff;border-radius:14px;
  padding:12px 16px;font-size:14px;font-weight:600;animation:drop .3s ease forwards}
@keyframes drop{from{transform:translate(-50%,-100%);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.hero{border-radius:24px;padding:28px 22px;text-align:center}
.hero.calm{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
.ansbtn{width:100%;padding:16px;border-radius:20px;font-size:16px;font-weight:700;margin-bottom:10px}
.a1{background:var(--orgBtn);color:var(--orgInk);box-shadow:0 3px 8px rgba(184,54,14,.24), 0 7px 18px -9px rgba(238,69,26,.28)}
.a1:hover{filter:brightness(1.05)}
.a1:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(184,54,14,.12)}
.a2{background:#fff;border:1.5px solid var(--line);color:var(--ink);box-shadow:0 2px 6px rgba(214,213,217,.52)}
.a2:hover{background:var(--bg)}
.a2:active{transform:translateY(2px);box-shadow:0 1px 2px rgba(214,213,217,.22)}
.a3{background:none;color:var(--faint);font-size:14px;text-decoration:underline;transition:opacity .12s ease}
.a3:active{opacity:.5}
.chip{padding:11px 8px;border-radius:14px;background:#fff;border:1.5px solid var(--line);font-weight:700;font-size:16px;text-align:center;
  box-shadow:0 2px 4px rgba(214,213,217,.6)}
.chip:active{transform:translateY(1px);box-shadow:0 1px 2px rgba(214,213,217,.2)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:0 2px 4px rgba(24,23,26,.18)}
.chip.on:active{box-shadow:0 1px 2px rgba(24,23,26,.1)}
button.mut{transition:opacity .12s ease}
button.mut:active{opacity:.5}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.statcard{background:var(--bg);border-radius:14px;padding:14px}
.statcard b{font-size:28px;display:block;margin-top:4px;letter-spacing:-.5px}
.kpi3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.kpi3 .statcard{padding:12px}
.kpi3 .statcard b{font-size:28px}
.statcard.accent{background:var(--bg);border-color:var(--line)}
.statcard.accent b{color:var(--ink)}
.wg-rate{width:38px;flex:none;text-align:right;font-size:12px;font-weight:800;color:var(--ink)}
.wg-head .wg-rate{color:var(--faint);font-weight:700}
.wg-nav{display:flex;align-items:center;justify-content:space-between;margin:2px 0 12px}
.wg-navlabel{text-align:center;line-height:1.35}
.wg-navweek{font-size:16px;font-weight:800;display:block}
.wg-navtag{font-size:12px;font-weight:700;color:var(--mut)}
.foldhead{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
.foldhead .cap{color:var(--ink);font-weight:700;font-size:14px}
.foldhead .chev{transition:transform .18s ease;color:var(--faint);flex:none;display:inline-flex;align-items:center}
.foldhead .chev svg{width:9px;height:14px;display:block}
.foldhead.open .chev{transform:rotate(90deg)}
.foldpreview{font-size:12px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px}
.notenav{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
.notenavbtn{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:#fff;
  color:var(--mut);font-size:16px;font-weight:700;display:flex;align-items:center;justify-content:center}
.notenavbtn[disabled]{opacity:.3;pointer-events:none}
.routine-add{width:38px;height:38px;flex:none;border-radius:50%;border:none;background:var(--ink);
  color:#fff;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;transition:transform .12s ease, opacity .15s ease}
.routine-add:active{transform:scale(.9);opacity:.8}
.notenavbtn:active{transform:scale(.9)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.wg{margin-bottom:10px}
.wg-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--line)}
.wg-name{width:58px;flex:none;font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wg-cells{display:grid;grid-template-columns:repeat(7,28px);justify-content:space-between;flex:1}
.wg-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding-left:0;padding-right:0}
.wg-head .wg-cell{aspect-ratio:2;background:none;color:var(--faint);font-weight:700;font-size:12px}
.wg-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:14px}
.wg-legend span{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mut)}
.mcal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.mcal-head span{text-align:center;font-size:12px;color:var(--mut);font-weight:700}
.mcal-row{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.mcal-cell{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:14px;color:var(--faint)}
.mcal-cell.empty{background:none}
.mcal-cell.today{color:var(--ink);font-weight:700}
.mcal-cell img{display:block;width:70%;height:auto}
.tbl th{text-align:left;padding:8px 6px;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.spin{display:flex;justify-content:center;padding:40px 0;color:var(--faint);font-size:14px}
.heroring{border:1px solid var(--line);border-radius:18px;
  padding:20px 22px;display:flex;flex-direction:column;gap:14px;margin-bottom:16px}
.heroring-body{display:flex;align-items:center;justify-content:center;gap:18px}
.heroring .meta{flex:1}
.mrow{display:flex;align-items:center;gap:12px}
.mrow .body{flex:1;min-width:0}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block}
.hidden{display:none!important}

/* ── 폼 카드 진입 애니메이션 (로그인/가입/프로필완성) ── */
@keyframes fadeSlideUp{from{opacity:0;transform:translateY(14px);filter:blur(6px)}to{opacity:1;transform:none;filter:blur(0)}}

/* ── 에러 시 흔들림 ── */
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.shake{animation:shake .4s ease}

/* ── 필드 안 아이콘 + 유효 체크 ── */
.field-ic{position:relative}
.field-ic svg.fi{position:absolute;left:12px;top:38px;color:var(--faint);pointer-events:none}
.field-ic .txt{padding-left:38px}
.field-ic .ok-check{position:absolute;right:12px;top:38px;color:var(--ok);
  transform:scale(0);transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.field-ic .ok-check.on{transform:scale(1)}

/* ── 비밀번호 강도 문구 ── */
.pwmeter .lbl{font-size:14px;margin:-8px 0 14px;display:block}

/* ── 온보딩 스텝 도트 + 슬라이드 전환 ── */
.stepdots{display:flex;justify-content:center;gap:6px;margin-bottom:22px}
.stepdots i{height:6px;width:6px;border-radius:99px;background:var(--line);display:block;
  transition:width .35s cubic-bezier(.34,1.56,.64,1),background .25s ease}
.stepdots i.on{background:var(--org);width:22px}
.stepdots i.done{background:var(--org)}
@keyframes slideStep{from{opacity:0;transform:translateX(26px);filter:blur(5px)}to{opacity:1;transform:none;filter:blur(0)}}
.stepwrap{animation:slideStep .38s cubic-bezier(.22,1,.36,1)}

/* ── 완료 축하 버스트 ── */
@keyframes burstPop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes burstFly{0%{transform:translate(0,0) scale(0);opacity:1}55%{opacity:1}100%{transform:var(--fly) scale(1);opacity:0}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.burst{position:relative;width:68px;height:68px;margin:0 auto}
.burst .core{position:absolute;inset:0;border-radius:50%;background:var(--orgBtn);display:flex;align-items:center;justify-content:center;
  animation:burstPop .4s cubic-bezier(.34,1.56,.64,1)}
.burst .p{position:absolute;top:50%;left:50%;width:6px;height:6px;border-radius:50%;margin:-3px;
  animation:burstFly .65s ease-out forwards;animation-delay:.15s;opacity:0}
.burst svg path{stroke-dasharray:20;stroke-dashoffset:20;animation:drawCheck .35s .3s ease forwards}

/* ── 원형 링: 그려지듯 차오르는 애니메이션 + 완료 시 은은한 글로우 (컨페티 대신 절제) ── */
.ringwrap{position:relative;display:inline-flex;border-radius:50%}
.ringwrap.ring-half{border-radius:24px}
.ring-fill{transition:stroke-dashoffset 1s cubic-bezier(.22,1,.36,1)}
@keyframes ringGlow{0%{box-shadow:0 0 0 0 rgba(15,122,94,.32)}70%{box-shadow:0 0 0 9px rgba(15,122,94,0)}100%{box-shadow:0 0 0 0 rgba(15,122,94,0)}}
.ring-done{animation:ringGlow 1.6s ease-out 1}

/* ── 오늘 케어 리스트: 순차 진입 + 미해결 상태만 은은하게 숨쉬는 점 ── */
@keyframes rowIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.carein{animation:rowIn .4s cubic-bezier(.22,1,.36,1) both}
@keyframes softPulse{0%,100%{opacity:1}50%{opacity:.32}}
.hdot.pulse{animation:softPulse 1.7s ease-in-out infinite}

/* ── 2단 슬라이딩 토글 ── */
.seg2{position:relative;display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg2 button{flex:1;position:relative;z-index:1;padding:7px 18px;font-size:14px;font-weight:700;color:var(--mut);border-radius:9px;transition:color .2s ease, background .2s ease, box-shadow .2s ease;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;text-align:center;line-height:1;background:transparent}
.seg2 button.on{color:var(--ink);background:#fff;box-shadow:0 1px 3px rgba(24,23,26,.12)}
.seg2-thumb{display:none}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════════════════════
   설정 — 본인 Supabase 프로젝트 정보로 반드시 교체하세요

  async findMemberByToken(token){
    // 회원 화면 전용 조회 — 테이블에 직접 접근하지 않고, 이 토큰에 해당하는
    // 회원 한 명의 안전한 필드만 돌려주는 DB 함수(rpc_member_by_token)를 통해서만

    // rls-hardening.sql 참고)

  async createCheckLog(memberId, trainerId, checkType, client=sb){

function memberChecks(memberId){ return CACHE.checks.filter(c=>c.member_id===memberId); }
function memberContacts(memberId){ return CACHE.contacts.filter(c=>c.member_id===memberId); }

function weekRange(){
  const d=new Date(); const day=(d.getDay()+6)%7;
  const mon=new Date(d); mon.setDate(d.getDate()-day); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=x=>x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
  return { start:f(mon), end:f(sun) };
}
// 주간 오프셋 범위 (offset 0 = 이번 주, -1 = 지난 주 ...)
function weekRangeOffset(offset){
  const d=new Date(); const day=(d.getDay()+6)%7;
  const mon=new Date(d); mon.setDate(d.getDate()-day + offset*7); mon.setHours(0,0,0,0);
  const sun=new Date(mon); sun.setDate(mon.getDate()+6);
  const f=x=>x.getFullYear()+'-'+pad2(x.getMonth()+1)+'-'+pad2(x.getDate());
  return { start:f(mon), end:f(sun), monDate:mon };
}
// "n월 n주차" — 그 주 목요일이 속한 달 기준으로 계산 (월 경계 혼란 방지)
function weekLabel(offset){
  const {monDate}=weekRangeOffset(offset);
  const thu=new Date(monDate); thu.setDate(monDate.getDate()+3);
  const month=thu.getMonth()+1;
  const first=new Date(thu.getFullYear(), thu.getMonth(), 1);
  const firstDay=(first.getDay()+6)%7;
  const firstThu=new Date(first); firstThu.setDate(1 + ((3-firstDay)+7)%7);
  const weekNo=Math.floor((thu.getDate()-firstThu.getDate())/7)+1;
  return `${month}월 ${weekNo}주차`;
}
function weeklyDone(memberId){
  const {start,end}=weekRange();
  return memberChecks(memberId).filter(c=>c.check_type!=='morning' && c.response==='completed' && c.check_date>=start && c.check_date<=end).length;
}
function weeklyGoal(m){ return Math.max(1,(m.preferred_days||[]).length); }

/* ── 요일별 상태 격자 (월~일) — 기존 check_logs만으로 계산, DB 변경 없음 ──
   상태: none(대상 아님·발송 없음) / done(다녀옴) / difficult(어려움) / noresp(발송했으나 미응답) */
function weekGrid(m, offset=0){
  const {start,end}=weekRangeOffset(offset);
  const mon=new Date(start+'T00:00:00');
  const checks=memberChecks(m.id).filter(c=>c.check_type!=='morning' && c.check_date>=start && c.check_date<=end);
  const cells=[];
  for(let i=0;i<7;i++){                       // 0=월 ... 6=일
    const d=new Date(mon); d.setDate(mon.getDate()+i);
    const key=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    const dow=d.getDay();                      // 0=일 ... 6=토
    const log=checks.find(c=>c.check_date===key);
    let st='none';
    if(log){
      if(log.response==='completed') st='done';
      else if(log.response==='difficult') st='difficult';
      else if(log.sent_at) st='noresp';
      else st='none';
    }
    const isTarget = (m.preferred_days||[]).includes(dow);
    cells.push({ label:DAYS[dow], st, isTarget });
  }
  return cells;
}

/* ── 시그니처 원형 링: 이번 주 이행률 시각화 (그려지듯 차오름) ── */
function ring(done, goal, size=40){
  goal = Math.max(1, goal);
  const pct = Math.min(1, done/goal);
  const sw = size>=80 ? 8 : 5;
  const r = (size - sw) / 2;
  const c = 2 * Math.PI * r;
  const off = c * (1 - pct);
  const cx = size / 2;
  const col = pct>=1 ? 'var(--ok)' : done===0 ? 'var(--emptydot)' : 'var(--org)';
  const numSize = (size*0.34).toFixed(1);
  const denSize = (size*0.22).toFixed(1);
  return `<span class="ringwrap${pct>=1?' ring-done':''}">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="flex:none" aria-hidden="true">
      <circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="var(--line)" stroke-width="${sw}"/>
      <circle class="ring-fill" cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
        stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" data-off="${off.toFixed(1)}" transform="rotate(-90 ${cx} ${cx})"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" fill="var(--ink)"
        font-weight="800" font-size="${numSize}">${done}<tspan fill="var(--faint)" font-weight="700" font-size="${denSize}">/${goal}</tspan></text>
    </svg>
  </span>`;
}
function animateRings(){
  requestAnimationFrame(()=>{ document.querySelectorAll('.ring-fill').forEach(c=>{ c.style.strokeDashoffset = c.dataset.off; }); });
}
// 퍼센트 값을 직접 받아 그리는 링 (회원별 평균처럼 done/goal 카운트가 아닌 비율 자체가 지표일 때 사용)
function ringPercent(pct, size=180){
  const p = Math.max(0, Math.min(100, pct));
  const sw = Math.round(size*0.065);
  const r = (size-sw)/2, cx = size/2, cy = r+sw/2, height = cy+sw/2, hc = Math.PI*r, off = hc*(1-p/100);
  const col = p>=100 ? 'var(--ok)' : p===0 ? 'var(--emptydot)' : 'var(--org)';
  const numSize=(size*0.16).toFixed(1), pctSize=(size*0.09).toFixed(1);
  const path = `M ${sw/2} ${cy} A ${r} ${r} 0 0 1 ${size-sw/2} ${cy}`;
  return `<span class="ringwrap ring-half${p>=100?' ring-done':''}">
    <svg width="${size}" height="${height.toFixed(1)}" viewBox="0 0 ${size} ${height.toFixed(1)}" style="flex:none" aria-hidden="true">
      <path d="${path}" fill="none" stroke="var(--line)" stroke-width="${sw}" stroke-linecap="round"/>
      <path class="ring-fill" d="${path}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round"
        stroke-dasharray="${hc.toFixed(1)}" stroke-dashoffset="${hc.toFixed(1)}" data-off="${off.toFixed(1)}"/>
      <text x="50%" y="${(cy*0.8).toFixed(1)}" text-anchor="middle" dominant-baseline="central" fill="var(--ink)"
        font-weight="800" font-size="${numSize}">${Math.round(p)}<tspan fill="var(--faint)" font-weight="700" font-size="${pctSize}">%</tspan></text>
    </svg>
  </span>`;
}

function recentNoResponseStreak(memberId){
  // sent_at이 없는 행(아직 실제로 발송되지 않은 오늘자 placeholder 등)은 "무응답"으로
  // 셀 대상이 아니라서 스트릭 계산에서 아예 제외합니다.
  const list = memberChecks(memberId).filter(c=>c.check_type!=='morning' && c.sent_at).slice(0,3);
  let n=0; for(const c of list){ if(!c.response) n++; else break; } return n;
}
function careReason(m){
  if (m.track_enabled===false) return null;
  const t = todayCheckFor(m.id, 'evening');
  if (t && t.response==='difficult') return { key:'difficult', label:'오늘은 어려웠어요' };
  if (t && !t.response && t.sent_at) return { key:'no_response', label:'미응답' };
  if (recentNoResponseStreak(m.id) >= 2) return { key:'repeated_no_response', label:'반복 미응답' };
  return null;
}
function alreadyContactedToday(memberId){
  const t0=new Date(); t0.setHours(0,0,0,0);
  return memberContacts(memberId).some(c=> new Date(c.contacted_at) >= t0);
}

    repeated_no_response: `오늘이 목표하신 운동 요일이라 리마인드차 연락드려요.\n\n최근에 운동 체크가 몇 번 비어 있어서 가볍게 확인드려요.\n요즘 일정이 바쁘면 목표한 대로 운동 가는 게 쉽지 않을 수 있습니다.\n부담드리려는 건 아니고,\n흐름이 완전히 끊기지 않게 이번 주에 짧게라도 움직일 수 있는 시간을 같이 잡아보면 좋을 것 같아요.\n\n편한 시간 있으실까요?`

function pingActivity(){
  try{
    const last = sessionStorage.getItem('redeum_last_ping');
    const now = Date.now();
    if(last && now - Number(last) < 10*60*1000) return;
    sessionStorage.setItem('redeum_last_ping', String(now));
    const nextCount = (SESSION.profile?.open_count || 0) + 1;
    sb.from('trainer_profiles').update({ last_seen_at: new Date().toISOString(), open_count: nextCount }).eq('id', SESSION.user.id)
      .then(({error})=>{ if(error) console.warn('접속 로그 기록 실패', error.message); });
  }catch(e){ /* 접속 로그는 부가 기능 — 무시 */ }
}

async function refreshTodayChecks(){
  // 채널 자동발송은 daily-send 크론이 전담합니다.
  // 이 버튼은 "오늘 케어" 리스트가 최신 상태인지 확인/보정만 합니다
  // (신규 등록·설정 변경 회원 등 크론이 놓쳤을 수 있는 빈틈 메우기, 채널 발송 없음).
  UI.loading=true; render();
  // CACHE는 로그인 시점 이후로 다시 안 불러와지므로, 트레이너가 앱을 하루 종일
  // 켜둔 사이 크론이 만든 오늘자 체크를 로컬 캐시가 모를 수 있습니다. 캐시만 보고
  // "없음"으로 판단하면 이미 있는 체크를 중복 생성하게 되므로, 오늘자 기록은
  // 항상 DB에서 다시 확인합니다.
  const tk = todayKey();
  const { data: todayLogs } = await sb.from('check_logs').select('member_id, check_type')
    .eq('trainer_id', SESSION.user.id).eq('check_date', tk);
  const existSet = new Set((todayLogs||[]).map(c=>c.member_id+'_'+c.check_type));
  const targets = CACHE.members.filter(m=>m.status==='active' && m.track_enabled!==false && isTodayTarget(m));
  let made=0;
  for(const m of targets){
    if(!existSet.has(m.id+'_evening')){ await DB.createCheckLog(m.id, SESSION.user.id, 'evening'); made++; }
    if(m.reminder_level==='frequent' && !existSet.has(m.id+'_morning')){
      await DB.createCheckLog(m.id, SESSION.user.id, 'morning');
    }
  }
  await DB.loadAll(SESSION.user.id); // 방금 만든 기록 + 그 사이 회원이 직접 남긴 응답까지 화면에 반영
  UI.loading=false;
  toast(made>0 ? `${made}명 확인 완료 — 오늘 케어 리스트에 반영됐어요` : '이미 최신 상태예요, 놓친 회원 없음');
  render();
}

function memberCalendarHtml(completedDates){
  const now = new Date();
  const year = now.getFullYear(), month = now.getMonth();
  const completedSet = new Set(completedDates||[]);
  const startOffset = (new Date(year, month, 1).getDay()+6)%7; // 월요일 시작으로 보정
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const cells = [];
  for(let i=0;i<startOffset;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++) cells.push(d);
  while(cells.length%7!==0) cells.push(null);
  const todayD = now.getDate();
  let rows='';
  for(let r=0;r<cells.length;r+=7){
    rows += `<div class="mcal-row">${cells.slice(r,r+7).map(d=>{
      if(d===null) return `<span class="mcal-cell empty"></span>`;
      const key = `${year}-${pad2(month+1)}-${pad2(d)}`;
      const isDone = completedSet.has(key);
      const isToday = d===todayD;
      if(isDone) return `<span class="mcal-cell">${statusIcon('done', true, 28)}</span>`;
      return `<span class="mcal-cell${isToday?' today':''}">${d}</span>`;
    }).join('')}</div>`;
  }
  return `<div class="mcal-head">${DAYS_MON.map(d=>`<span>${d}</span>`).join('')}</div>${rows}`;
}

  UI.loading=true; render();
  // 테이블에 직접 update하지 않고, 토큰으로 찾은 회원의 "오늘" 로그만(그리고 아직
  // 미응답인 경우에만) 수정하는 rpc_submit_check을 통해서만 저장합니다.
  const { error } = await sbPublic.rpc('rpc_submit_check', { p_token: token, p_response: response, p_note_exercise: note_exercise, p_note_diet: note_diet });
  UI.loading=false;
  if(error){ toast('제출 실패: '+error.message); render(); return; }
  CHK.log = { ...CHK.log, response, response_at: new Date().toISOString(),
    member_note_exercise: note_exercise||CHK.log.member_note_exercise,
    member_note_diet: note_diet||CHK.log.member_note_diet };
  render();
}

function render(){
  const app=document.getElementById('app');
  const path=location.pathname;
  const hash=location.hash;
  const isInvite = path.startsWith('/invite/') || hash.startsWith('#/invite/');
  const isCheck = path.startsWith('/check/') || hash.startsWith('#/check/');
  if(isInvite){ app.style.background='var(--warm)'; return renderRoute(app, viewInvite()); }
  if(isCheck){ app.style.background='var(--warm)'; return renderRoute(app, viewCheckPage()); }
  app.style.background='var(--card)';

  if(!SESSION.user) return renderRoute(app, viewAuth());
  if(!SESSION.profile) return renderRoute(app, viewCompleteProfile());

  let body = UI.tab==='care' ? viewCare() : UI.tab==='members' ? viewMembers() : viewSummary();
  const name = SESSION.profile.name || '';

function viewSummary(){
  const wo = UI.weekOffset||0;
  const {start,end} = weekRangeOffset(wo);
  const active = CACHE.members.filter(m=>m.status==='active');
  const evChecks = CACHE.checks.filter(c=>c.check_type!=='morning' && c.check_date>=start && c.check_date<=end);
  const sent = evChecks.filter(c=>c.sent_at).length;
  const completed = evChecks.filter(c=>c.response==='completed').length;
  const difficult = evChecks.filter(c=>c.response==='difficult').length;
  const noresp = evChecks.filter(c=>c.sent_at && !c.response).length;
  const wkStartD = new Date(start+'T00:00:00'); const wkEndExclD = new Date(end+'T00:00:00'); wkEndExclD.setDate(wkEndExclD.getDate()+1);
  const contactsThisWeek = CACHE.contacts.filter(c=>{const t=new Date(c.contacted_at); return t>=wkStartD && t<wkEndExclD;}).length;
  const needCareCount = evChecks.filter(c=>c.need_care || (c.sent_at && !c.response)).length;
  const carecount = careMembers().length; // '오늘' 기준 — 주차 이동과 무관 (항상 지금)

  // 회원별 이행률(다녀옴/발송)·응답률(응답/발송)을 각각 구한 뒤, 회원 수만큼 평균 —
  // 발송 많은 회원에게 쏠리지 않도록 모든 회원을 동일 가중치로 반영
  const perMember = active.map(m=>{
    const mc = memberChecks(m.id).filter(c=>c.check_type!=='morning' && c.check_date>=start && c.check_date<=end);
    const msent = mc.filter(c=>c.sent_at).length;
    if(!msent) return null;
    const mdone = mc.filter(c=>c.response==='completed').length;
    const mresp = mc.filter(c=>c.response==='completed'||c.response==='difficult').length;
    return { done:mdone, sent:msent, adh: mdone/msent*100, resp: mresp/msent*100 };
  }).filter(Boolean);
  const avg = arr => arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : 0;
  const adhPct = avg(perMember.map(x=>x.adh));       // 이행률 — 회원별 평균
  const respPct = avg(perMember.map(x=>x.resp));      // 응답률 — 회원별 평균
  const followPct = needCareCount ? Math.min(100, Math.round(contactsThisWeek/needCareCount*100)) : 0;

  // 요일 격자의 회원별 '이행' — 그 주 실제 발송 로그 기준 (현재 스케줄이 아니라 과거 실제 값 사용 → 주차 이동해도 왜곡 없음)
  const memberRateOffset = m => {
    const mc = memberChecks(m.id).filter(c=>c.check_type!=='morning' && c.check_date>=start && c.check_date<=end);
    const msent = mc.filter(c=>c.sent_at).length;
    if(!msent) return null;
    return Math.round(mc.filter(c=>c.response==='completed').length/msent*100);
  };
  const weekHasData = perMember.length>0;

  return `
    <h1 style="margin-bottom:14px">주간 리포트</h1>
    <div class="statgrid">
      <div class="statcard"><span class="cap">관리중인 회원</span><b>${active.length}명</b></div>
      <div class="statcard accent"><span class="cap">케어 필요 회원</span><b>${carecount}명</b></div>
    </div>
    <div class="wg-nav">
      <button class="notenavbtn" onclick="UI.weekOffset=(UI.weekOffset||0)-1;render()" aria-label="이전 주">‹</button>
      <div class="wg-navlabel">
        <span class="wg-navweek">${weekLabel(wo)}</span>
        ${wo===0?'<span class="wg-navtag">이번 주</span>':`<span class="mut" style="font-size:12px">${start.slice(5).replace('-','.')} ~ ${end.slice(5).replace('-','.')}</span>`}
      </div>
      <button class="notenavbtn" onclick="if((UI.weekOffset||0)<0){UI.weekOffset=(UI.weekOffset||0)+1;render()}" aria-label="다음 주" ${wo>=0?'disabled':''}>›</button>
    </div>
    ${!weekHasData ? `<div class="card" style="text-align:center;padding:28px 16px"><p class="mut">이 주에는 기록이 없어요</p></div>` : `
    <div class="heroring">
      <p class="cap" style="font-size:14px;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:space-between">이행률${helpBtn('adh','카톡을 보낸 회원 중,<br>"다녀왔어요"라고 답한 비율이에요.')}</p>
      <div class="heroring-body">
        ${ringPercent(adhPct, 180)}
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px">
      <div class="heroring" style="margin-bottom:0">
        <p class="cap" style="font-size:14px;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:space-between">응답률${helpBtn('resp','보낸 체크 중 회원이 답을 남긴 비율이에요.')}</p>
        <b style="font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1">${respPct}<span style="font-size:16px;font-weight:700;color:var(--faint)">%</span></b>
      </div>
      <div class="heroring" style="margin-bottom:0">
        <p class="cap" style="font-size:14px;color:var(--ink);font-weight:700;display:flex;align-items:center;justify-content:space-between">후속 연락률${helpBtn('follow','확인이 필요했던 회원(어려웠어요 or 미응답)에게 실제로 연락한 비율이에요.')}</p>
        <b style="font-size:28px;font-weight:800;letter-spacing:-.5px;line-height:1">${followPct}<span style="font-size:16px;font-weight:700;color:var(--faint)">%</span></b>
      </div>
    </div>
    <div class="heroring">
      <p class="cap" style="font-size:14px;color:var(--ink);font-weight:700">상세 (전체 합계)</p>
      <div>
        <p style="font-size:14px;margin:4px 0">체크 발송 <b style="float:right">${sent}회</b></p>
        <p style="font-size:14px;margin:4px 0">다녀왔어요 <b style="float:right">${completed}</b></p>
        <p style="font-size:14px;margin:4px 0">오늘은 어려웠어요 <b style="float:right">${difficult}</b></p>
        <p style="font-size:14px;margin:4px 0">미응답 <b style="float:right">${noresp}</b></p>
        <p style="font-size:14px;margin:4px 0">후속 연락 <b style="float:right">${contactsThisWeek}회</b></p>
      </div>
    </div>
    <div class="wg">
      <div class="wg-row wg-head">
        <span class="wg-name"></span>
        <div class="wg-cells">${DAYS_MON.map(d=>`<span class="wg-cell">${d}</span>`).join('')}</div>
        <span class="wg-rate">이행</span>
      </div>
      ${active.map(m=>{
        const cells = weekGrid(m, wo);
        const r = memberRateOffset(m);
        return `<div class="wg-row">
          <span class="wg-name">${esc(m.name)}</span>
          <div class="wg-cells">${cells.map(c=>{
            return `<span class="wg-cell">${statusIcon(c.st, c.isTarget)}</span>`;
          }).join('')}</div>
          <span class="wg-rate">${r===null?'-':r+'%'}</span>
        </div>`;
      }).join('')}
    </div>
    <div class="wg-legend">
      <span>${statusIcon('done',true,16)}다녀옴</span>
      <span>${statusIcon('difficult',true,16)}어려움</span>
      <span>${statusIcon('noresp',true,16)}미응답</span>
      <span>${statusIcon('none',true,16)}예정</span>
      <span>${statusIcon('none',false,16)}대상 아님</span>
    </div>`}
  `;
}

function tokenFromUrl(kind){
  // 경로 방식(/invite/토큰, /check/토큰) 우선, 없으면 예전 해시 방식(#/invite/토큰) 사용
  const p = location.pathname;
  const prefix = '/'+kind+'/';
  if(p.startsWith(prefix)) return decodeURIComponent(p.slice(prefix.length));
  const hprefix = '#/'+kind+'/';
  if(location.hash.startsWith(hprefix)) return decodeURIComponent(location.hash.slice(hprefix.length));
  return '';
}

function seedDemoData(){
  const today = new Date();
  const dayKey = (offset)=>{
    const d = new Date(today); d.setDate(today.getDate()+offset);
    return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
  };
  const iso = (offset,h=20,m=0)=>{
    const d = new Date(today); d.setDate(today.getDate()+offset); d.setHours(h,m,0,0);
    return d.toISOString();
  };
  const trainerId = 'demo-trainer-1';
  // 이번 주 월요일 오프셋 계산
  const monOffset = -(((today.getDay()+6)%7));

  const members = [
    { id:'m1', trainer_id:trainerId, name:'김민준', phone:'010-1111-1111', preferred_days:[1,3,5], reminder_level:'normal', status:'active', track_enabled:true, trainer_memo:'', invite_token:'tok1', invite_status:'onboarded', created_at:iso(-30) },
    { id:'m2', trainer_id:trainerId, name:'박서연', phone:'010-2222-2222', preferred_days:[2,4], reminder_level:'frequent', status:'active', track_enabled:true, trainer_memo:'', invite_token:'tok2', invite_status:'onboarded', created_at:iso(-25) },
    { id:'m3', trainer_id:trainerId, name:'이도윤', phone:'010-3333-3333', preferred_days:[1,2,3,4,5], reminder_level:'normal', status:'active', track_enabled:true, trainer_memo:'무릎 컨디션 가끔 확인 필요', invite_token:'tok3', invite_status:'onboarded', created_at:iso(-20) },
    { id:'m4', trainer_id:trainerId, name:'최지우', phone:'010-4444-4444', preferred_days:[3,6], reminder_level:'normal', status:'active', track_enabled:true, trainer_memo:'', invite_token:'tok4', invite_status:'onboarded', created_at:iso(-15) },
    { id:'m5', trainer_id:trainerId, name:'정하은', phone:null, preferred_days:[], reminder_level:'normal', status:'pending', track_enabled:true, invite_token:'tok5', invite_status:'created', created_at:iso(-2) },
  ];

  const checks = [];
  const cid = (()=>{ let n=0; return ()=>'c'+(++n); })();
  // 이번 주 월~오늘까지 체크 로그 (오늘 = 화요일 가정)
  // 김민준(월수금): 월 완료 / 오늘은 요일 아님
  checks.push({ id:cid(), member_id:'m1', trainer_id:trainerId, check_date:dayKey(monOffset), check_type:'evening', response:'completed', sent_at:iso(monOffset,21,30), response_at:iso(monOffset,22,15), member_note_exercise:'부위: 하체 / 기타: 헬스장에서 30분', member_note_diet:'아침: 삶은달걀2개 + 고구마 2개\n저녁: 목살 40g + 현미밥 300g\n\n[궁금한점 & 고민]\n하체가다가 무릎이 좀 아픈데 괜찮을까요?' });
  // 박서연(화목, 자주챙김): 오늘(화) 발송했으나 미응답
  checks.push({ id:cid(), member_id:'m2', trainer_id:trainerId, check_date:todayKey(), check_type:'evening', response:null, sent_at:iso(0,21,30), response_at:null });
  // 이도윤(월~금): 월 완료 / 오늘(화) 어려움
  checks.push({ id:cid(), member_id:'m3', trainer_id:trainerId, check_date:dayKey(monOffset), check_type:'evening', response:'completed', sent_at:iso(monOffset,21,30), response_at:iso(monOffset,22,10) });
  checks.push({ id:cid(), member_id:'m3', trainer_id:trainerId, check_date:todayKey(), check_type:'evening', response:'difficult', sent_at:iso(0,21,30), response_at:iso(0,22,5), member_note_exercise:'오늘은 컨디션이 안 좋아서 못 갔어요' });
  // 최지우(수토): 지난 주 수요일 미응답이 반복 (반복 미응답 사유 발생)
  checks.push({ id:cid(), member_id:'m4', trainer_id:trainerId, check_date:dayKey(monOffset-5), check_type:'evening', response:null, sent_at:iso(monOffset-5,21,30) });
  checks.push({ id:cid(), member_id:'m4', trainer_id:trainerId, check_date:dayKey(monOffset-2), check_type:'evening', response:null, sent_at:iso(monOffset-2,21,30) });
  // 최지우 지난주 메모
  checks.push({ id:cid(), member_id:'m4', trainer_id:trainerId, check_date:dayKey(monOffset-6), check_type:'evening', response:'completed', sent_at:iso(monOffset-6,21,30), response_at:iso(monOffset-6,22,0), member_note_exercise:'부위: 가슴, 하체', member_note_diet:'아침: 닭가슴살 2개\n점심: 베이글 + 그릭요거트 1개\n\n[궁금한점 & 고민]\n닭가슴살 대신 단백질 음료로 먹어도 괜찮을까요?' });

  const contacts = [
    { id:'ct1', member_id:'m1', trainer_id:trainerId, check_log_id:null, reason:'no_response', contacted_at:iso(-3,19,0), memo:'전화로 안부 확인, 다음 주부터 다시 시작하기로 함' },
  ];

  SESSION.profile = { id:trainerId, name:'정하은', center_name:'리듬짐 홍대점', open_count:12, last_seen_at:iso(0,9,12) };
  CACHE.members = members;
  CACHE.checks = checks;
  CACHE.contacts = contacts;
}

if(DEMO_MODE){
  // 데모 모드: Supabase 우회 + 더미 데이터 + 아무 값이나 로그인 통과
  // 새로고침 시 로그인 유지를 위해 sessionStorage 사용 (탭 닫으면 초기화)
  const DEMO_KEY = 'rideum_demo_session';
  const DEMO_UI_KEY = 'rideum_demo_ui';
  const saveDemoSession = ()=>{ try{ sessionStorage.setItem(DEMO_KEY, JSON.stringify({name:SESSION.profile.name, center:SESSION.profile.center_name})); }catch(e){} };
  const saveDemoUI = ()=>{
    try{
      sessionStorage.setItem(DEMO_UI_KEY, JSON.stringify({
        tab:UI.tab, editId:UI.editId, careSelected:UI.careSelected, weekOffset:UI.weekOffset
      }));
    }catch(e){}
  };
  const clearDemoSession = ()=>{ try{ sessionStorage.removeItem(DEMO_KEY); sessionStorage.removeItem(DEMO_UI_KEY); }catch(e){} };
  const restoreDemoSession = ()=>{
    try{
      const raw = sessionStorage.getItem(DEMO_KEY);
      if(!raw) return false;
      const s = JSON.parse(raw);
      seedDemoData();
      if(s.name) SESSION.profile.name = s.name;
      if(s.center!==undefined) SESSION.profile.center_name = s.center;
      const uiRaw = sessionStorage.getItem(DEMO_UI_KEY);
      if(uiRaw){
        const u = JSON.parse(uiRaw);
        if(u.tab) UI.tab = u.tab;
        if(u.editId) UI.editId = u.editId;
        if(u.careSelected) UI.careSelected = u.careSelected;
        if(typeof u.weekOffset === 'number') UI.weekOffset = u.weekOffset;
      }
      return true;
    }catch(e){ return false; }
  };
  // render 호출마다 현재 UI 상태 자동 저장 (원본 render 감싸기)
  const _origRender = render;
  render = function(){
    _origRender.apply(this, arguments);
    if(SESSION.user) saveDemoUI();
  };

  doLogin = async function(){
    const email=(document.getElementById('li-email')||{}).value||'';
    if(!email){ UI.authErr='이메일과 비밀번호를 입력해주세요'; render(); return; }
    UI.loading=true; UI.authErr=''; render();
    setTimeout(()=>{ seedDemoData(); saveDemoSession(); UI.loading=false; render(); }, 300);
  };
  doSignup = async function(){
    const name=(document.getElementById('su-name')||{}).value||'';
    if(!name){ UI.authErr='이름·이메일·비밀번호를 모두 입력해주세요'; render(); return; }
    UI.loading=true; UI.authErr=''; render();
    setTimeout(()=>{
      seedDemoData();
      SESSION.profile.name = name;
      saveDemoSession();
      UI.loading=false; render();
    }, 300);
  };
  doLogout = async function(){
    clearDemoSession();
    SESSION={user:null,profile:null}; CACHE={members:[],checks:[],contacts:[]};
    UI.tab='care'; UI.careSelected=null; render();
  };
  // 저장/생성 등 DB 호출은 로컬 캐시만 갱신하도록 스텁 처리
  DB.updateMember = async function(id, patch){
    const i=CACHE.members.findIndex(m=>m.id===id);
    if(i>-1){ CACHE.members[i]={...CACHE.members[i], ...patch}; }
    return CACHE.members[i];
  };
  DB.createMember = async function(trainerId, name, phone){
    const m = { id:'m'+(CACHE.members.length+1), trainer_id:trainerId, name, phone, preferred_days:[], reminder_level:'normal', status:'pending', track_enabled:true, invite_token:'tok'+Date.now(), invite_status:'created', created_at:new Date().toISOString() };
    CACHE.members.unshift(m); return m;
  };
  DB.createContact = async function(memberId, trainerId, checkLogId, reason){
    const c = { id:'ct'+Date.now(), member_id:memberId, trainer_id:trainerId, check_log_id:checkLogId, reason, contacted_at:new Date().toISOString() };
    CACHE.contacts.unshift(c); return c;
  };
  DB.createCheckLog = async function(memberId, trainerId, checkType){
    const c = { id:'c'+Date.now(), member_id:memberId, trainer_id:trainerId, check_date:todayKey(), check_type:checkType, response:null, sent_at:new Date().toISOString() };
    CACHE.checks.unshift(c); return c;
  };
  refreshTodayChecks = async function(){
    toast('데모 모드 — 이미 최신 상태예요');
  };
  pingActivity = function(){};
  restoreDemoSession(); // 새로고침 시 이전 로그인 상태 복원
  render();
} else {
  (async ()=>{
    try{
      const { data:{session} } = await sb.auth.getSession();
      if(session){
        UI.loading=true; render();
        SESSION.user = session.user;
        await loadProfile();
        UI.loading=false;
      }
    }catch(e){ /* Supabase 설정 전이면 여기서 실패할 수 있음 — 로그인 화면으로 진행 */ }
    render();
  })();
}
</script>
</body>
</html>
